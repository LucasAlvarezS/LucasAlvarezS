<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="631" viewBox="0 0 1000 631" role="img" aria-label="soou (privado): Un agente de código empieza de cero en cada sesión, y el siguiente nunca se entera de lo que ya sabías. soou guarda ese contexto y decide qué modelo merece cada tarea. Cómo decide soou: trivial -&gt; modelo barato, sin razonamiento; contextual -&gt; modelo intermedio; complejo -&gt; modelo de frontera; ambiguo o de riesgo -&gt; frontera + verificación cruzada.">
  <text x="2" y="32" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#EF7F1D" font-weight="500">01</text>
  <image x="54" y="13" width="137" height="32" href="data:image/png;base64,"/>
  <text x="998" y="31" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#74706B" letter-spacing="1.6" text-anchor="end">PRIVADO</text>
  <text x="54" y="70" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#A09C97">Un agente de código empieza de cero en cada sesión, y el siguiente nunca se entera de lo que ya sabías.</text>
  <text x="54" y="94" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#A09C97">soou guarda ese contexto y decide qué modelo merece cada tarea.</text>
  <text x="54" y="123" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#74706B">Python sin dependencias · servidor MCP · más de 120 tests en CI</text>

  <text x="546" y="394" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#74706B">un segundo agente en paralelo revisa el resultado del primero</text>
  <line x1="54" y1="415" x2="998" y2="415" stroke="#343029" stroke-width="1" opacity="0.8"/>
  <text x="54" y="437" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A09C97">Quince agentes de línea de comandos · ocho herramientas MCP · tope de gasto por día</text>
  <text x="54" y="479" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#EF7F1D" font-weight="500" letter-spacing="1.6">CAÍDA</text>
  <text x="196" y="479" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#E8E6E3" opacity="0.9">Si el agente elegido no está disponible, la tarea baja al siguiente del nivel.</text>
  <line x1="54" y1="490" x2="998" y2="490" stroke="#343029" stroke-width="1" opacity="0.55"/>
  <text x="54" y="511" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#EF7F1D" font-weight="500" letter-spacing="1.6">PERMISOS</text>
  <text x="196" y="511" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#E8E6E3" opacity="0.9">Los agentes de solo lectura quedan fuera de las tareas que escriben en disco.</text>
  <line x1="54" y1="522" x2="998" y2="522" stroke="#343029" stroke-width="1" opacity="0.55"/>
  <text x="54" y="543" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#EF7F1D" font-weight="500" letter-spacing="1.6">CONTEXTO</text>
  <text x="196" y="543" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#E8E6E3" opacity="0.9">Un servidor MCP le entrega al agente lo aprendido en sesiones previas.</text>
  <line x1="54" y1="554" x2="998" y2="554" stroke="#343029" stroke-width="1" opacity="0.55"/>
  <text x="54" y="575" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#EF7F1D" font-weight="500" letter-spacing="1.6">COSTO</text>
  <text x="196" y="575" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#E8E6E3" opacity="0.9">Tope de gasto por día, configurable por perfil: individual, equipo u organización.</text>

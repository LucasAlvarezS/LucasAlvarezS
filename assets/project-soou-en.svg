<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="631" viewBox="0 0 1000 631" role="img" aria-label="soou (private): A coding agent starts from zero every session, and the next one never learns what you already knew. soou keeps that context and decides which model each task deserves. How soou decides: trivial -&gt; cheap model, no reasoning; contextual -&gt; mid-tier model; complex -&gt; frontier model; ambiguous or risky -&gt; frontier + cross-check.">
  <text x="2" y="32" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#B86E12" font-weight="500">01</text>
  <image x="54" y="13" width="137" height="32" href="data:image/png;base64,"/>
  <text x="998" y="31" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#9A938E" letter-spacing="1.6" text-anchor="end">PRIVATE</text>
  <text x="54" y="70" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#7E7875">A coding agent starts from zero every session, and the next one never learns what you already knew.</text>
  <text x="54" y="94" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#7E7875">soou keeps that context and decides which model each task deserves.</text>
  <text x="54" y="123" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8E8884">Python with zero dependencies · MCP server · 120+ tests in CI</text>
  <rect x="34" y="159" width="2" height="424" fill="#B86E12" opacity="0.45"/>
  <text x="54" y="173" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#B86E12" font-weight="500" letter-spacing="1.8">HOW SOOU DECIDES</text>
  <circle cx="60" cy="197" r="4.5" fill="#B86E12"/>
  <text x="76" y="202" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8E8884" font-weight="500" letter-spacing="1.6">TASK</text>
  <line x1="60" y1="206" x2="60" y2="361" stroke="#8A8A8A" stroke-width="1.5"/>
  <line x1="60" y1="217" x2="101" y2="217" stroke="#8A8A8A" stroke-width="1.5"/>
  <circle cx="106" cy="217" r="3.5" fill="#B86E12" opacity="0.35"/>
  <text x="124" y="222" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#6A635E" font-weight="600">trivial</text>
  <line x1="179.7" y1="217" x2="500" y2="217" stroke="#9A938E" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 506 213 l 5 4 l -5 4" fill="none" stroke="#9A938E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="222" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#7E7875">cheap model, no reasoning</text>
  <line x1="60" y1="265" x2="101" y2="265" stroke="#8A8A8A" stroke-width="1.5"/>
  <circle cx="106" cy="265" r="3.5" fill="#B86E12" opacity="0.55"/>
  <text x="124" y="270" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#6A635E" font-weight="600">contextual</text>
  <line x1="211.5" y1="265" x2="500" y2="265" stroke="#9A938E" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 506 261 l 5 4 l -5 4" fill="none" stroke="#9A938E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="270" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#7E7875">mid-tier model</text>
  <line x1="60" y1="313" x2="101" y2="313" stroke="#8A8A8A" stroke-width="1.5"/>
  <circle cx="106" cy="313" r="3.5" fill="#B86E12" opacity="0.8"/>
  <text x="124" y="318" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#6A635E" font-weight="600">complex</text>
  <line x1="199.4" y1="313" x2="500" y2="313" stroke="#9A938E" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 506 309 l 5 4 l -5 4" fill="none" stroke="#9A938E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="318" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#7E7875">frontier model</text>
  <line x1="60" y1="361" x2="101" y2="361" stroke="#8A8A8A" stroke-width="1.5"/>
  <circle cx="106" cy="361" r="3.5" fill="#B86E12" opacity="1"/>
  <text x="124" y="366" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#6A635E" font-weight="600">ambiguous or risky</text>
  <line x1="271.0" y1="361" x2="500" y2="361" stroke="#9A938E" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 506 357 l 5 4 l -5 4" fill="none" stroke="#9A938E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="522" y="366" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#7E7875">frontier + cross-check</text>
  <path d="M 528 375 v 10 q 0 5 5 5 h 6" fill="none" stroke="#8A8A8A" stroke-width="1.2"/>
  <text x="546" y="394" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#9A938E">a second agent reviews the first one's output in parallel</text>
  <line x1="54" y1="415" x2="998" y2="415" stroke="#8A8A8A" stroke-width="1" opacity="0.8"/>
  <text x="54" y="437" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8E8884">Fifteen command-line agents · eight MCP tools · daily spend cap</text>
  <text x="54" y="479" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#B86E12" font-weight="500" letter-spacing="1.6">FALLBACK</text>
  <text x="196" y="479" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#7E7875">If the chosen agent is unavailable, the task drops to the next one at that level.</text>
  <line x1="54" y1="490" x2="998" y2="490" stroke="#8A8A8A" stroke-width="1" opacity="0.55"/>
  <text x="54" y="511" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#B86E12" font-weight="500" letter-spacing="1.6">PERMISSIONS</text>
  <text x="196" y="511" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#7E7875">Read-only agents are kept out of any task that writes to disk.</text>
  <line x1="54" y1="522" x2="998" y2="522" stroke="#8A8A8A" stroke-width="1" opacity="0.55"/>
  <text x="54" y="543" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#B86E12" font-weight="500" letter-spacing="1.6">CONTEXT</text>
  <text x="196" y="543" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#7E7875">An MCP server hands the agent what it learned in previous sessions.</text>
  <line x1="54" y1="554" x2="998" y2="554" stroke="#8A8A8A" stroke-width="1" opacity="0.55"/>
  <text x="54" y="575" font-family="'Spline Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#B86E12" font-weight="500" letter-spacing="1.6">COST</text>
  <text x="196" y="575" font-family="ui-sans-serif,'Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#7E7875">Daily spend cap, configurable per profile: solo, team or organisation.</text>
  <line x1="2" y1="619" x2="998" y2="619" stroke="#8A8A8A" stroke-width="1" opacity="0.8"/>
</svg>
